const CL=[
{n:'Minion Master',col:'#e23b4d',s:{walk:8.75,sprint:27.25,max:110,drain:9.5,regen:20.5},m:{cd:2.25,rng:8,ang:.9,dmg:22,po:2,pts:10},tc:30,ab:[['LMB','Slash','m1',2.25],['Q','Shot','q',12],['E','Dash','e',20],['R','Parry','r',22],['T','Minion','t',45]],d:'Point-fed minions. LMB poison slash, Q bouncing shot (press again to recast), hold E dash, R parry or reveal, T minions (30/65/100 pts).'},
{n:'Brute',col:'#e8742a',s:{walk:9.25,sprint:26.5,max:120,drain:11,regen:19},m:{cd:2,rng:9,ang:1.1,dmg:28,po:3,pts:12},tc:50,ab:[['LMB','Cleave','m1',2],['Q','Hook','q',14],['E','Leap','e',16],['R','Roar','r',24],['T','Berserk','t',40]],d:'Heavy melee, stuns on you last only 0.4s. LMB wide bleeding cleave, Q hook pulls a survivor to you, E leap slam to the cursor, R roar tires and slows nearby survivors, T berserk (50 pts): faster, cleave recharges 2x.'},

{n:'Tempest',col:'#fff176',s:{walk:9.5,sprint:27,max:100,drain:11,regen:22},m:{cd:1,rng:7,ang:.7,dmg:16,po:0,pts:8},tc:50,ab:[['LMB','Gale','m1',1],['Q','Gale Dash','q',8],['E','Gust','e',9],['R','Cyclone','r',22],['T','Storm','t',40]],d:'Skirmisher. LMB quick gale slash, Q gale dash chains up to three dashes (recast within 1.5s), E gust throws a wide piercing wind blade that slows, R cyclone sends a slow tornado that drags survivors into it, T storm (50 pts): slows and reveals everyone near you while you speed up.'},
{n:'Spectre',col:'#cfd8dc',s:{walk:9.25,sprint:25.5,max:105,drain:10,regen:21},m:{cd:1.2,rng:8,ang:.7,dmg:20,po:1.5,pts:9},tc:50,ab:[['LMB','Claw','m1',1.2],['Q','Boomerang','q',7],['E','Phase','e',12],['R','Orb','r',18],['T','Haunt','t',35]],d:'Wall-walker. LMB poison claw, Q soul blade is a boomerang that hits on the way out and back, E phase dash glides through walls, R homing orb seeks the nearest survivor, T haunt (50 pts): marks, reveals and tires every survivor near you.'},
{n:'Striker',col:'#69f0ae',s:{walk:9.5,sprint:26,max:100,drain:10,regen:22},m:{cd:1.3,rng:7,ang:.7,dmg:18,po:0,pts:8},tc:50,ab:[['LMB','Strike','m1',1.3],['Q','Pounce','q',10],['E','Sidestep','e',12],['R','Call','r',24],['T','Frenzy','t',40]],d:'Duelist. LMB strike, Q pounce homes in on the survivor nearest your aim for a weak hit that marks them, so pounce another survivor within 3.5s to chain (up to three pounces), and pouncing a marked survivor again lands a heavy double hit that ends the chain. Pounce has a 10s cooldown once the chain ends. Every pounce ends with brief stun immunity. E sidestep dashes forward and speeds up a chain, R call marks survivors nearby, T frenzy (50 pts): no pounce cooldown for 7s.'}];
