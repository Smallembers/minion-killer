[x] Guard nerf: hp 150 -> 125, own damage reduction 20% -> 12.5% (ST dr .8 -> .875), speed .94 -> .96; texts updated (Ward weakness on Guards unchanged)
[x] Map gimmick immunity bug: the hook/gravity pull flag (pl) only counted down in the bot AI path, so a player-controlled survivor (local or online) hit by Brute Hook, Gravity or Blood Hook stayed 'pulled' forever and ice, belts and portals skipped them for the rest of the round. Now pl counts down for players too (botUpd timers)
[x] Doubloon E dash: massive knockback (kb .9s at 150 u/s)
[x] Sapper bombs: 7s fuse (bmPrime; hand-over cut and Detonate unchanged)
[x] LMS damage reduction 20% (hurt: .7 -> .8); guided missile bullet removed from How the game works
[x] Map gimmick immunity (ice/belts/portals) investigated: they only skip entities in forced movement (killer dash/leap/xd, survivor dash/pin/pulled) and portals have a re-use lock; iframes never gate them. Changes: ice glide no longer resets on a big single-frame step (jump 4 -> 10 units, lag spikes/knockback used to drop the slide), portal re-use lock 2.2s -> 1.2s. Online friends' own character is predicted locally without map effects until the host state arrives (not changed)
[x] Input buffer for M1/abilities/dash/survivor stun: a press that does nothing is retried for 0.2s (INB, inFire, inRetry); Scout text no longer claims arrow aiming slows you (no such slowdown exists in code - a drop in speed with arrows + WASD + Shift held is keyboard ghosting losing Shift, rebind Sprint away from that cluster)
[x] Scout/line-stun survivors: no slow while aiming with arrow keys
[x] Disruptor range larger (sr 15 -> 21)
[x] Disruptor ring stun: killer parry (rwind) and foresight (fs) just absorb it, no counter damage/slow/mark on the Disruptor (stunRes, b.dzl)
[x] Minion Master dash: a kill refills the 3 rebounds, keeps fast speed and keeps dashing (dash(), K.dk)
[x] Powder trail chain-explodes when a bomb blast reaches it (pwBoom); Detonate keeps the trail
[x] Sapper guided missile: blast radius 30% -> 100% over first 1s (mslR); speed ramp 15% faster, turn decay untouched
[x] Punch item: 0.45s windup then a short mini dash (PDT/PDS, ~14 units) that stuns the killer on body contact (punchFire/punchDash)
[x] Detonate cooldown resets when it sets off a bomb on a survivor
[x] M1 with W+D+Shift+Left+Right held: hardware ghosting cannot be fixed in code, so K and L now also attack (ATKK; hold works for auto killers). Tell user to use K/L or mouse click
[x] Background gameplay in the host's multiplayer lobby after a round ends: mpBack now starts a fresh background match (spGo(1) + blur); mpGo already clears it - untested, guests' screens unchanged
[x] Fencer: dash hits (K.st xd/dash/leap) are blocked not parried; every block/parry = fenGain (2s speed, +10 HP, or 10 overshield 'osh' max 20 at full HP); projectile block also heals
[x] Survivor timer buttons as an EXPERIMENTAL setting (TB, Settings > Experimental, off by default): up to 3 buttons, walk on = timer -2.5s (every 3rd -4s), spawn every 10-16s, AI detours to them when killer > 22 away (tbU, TBS). Local only, untested
[x] Cleric Mend nerf: self heal 8 -> 6, others 19 -> 16 (mend, mendAI, description)
[x] Cleric LMS ability = stun that heals 25 HP if it lands (already in stunRes, verified)
[x] Striker Q damage buff: first hit 4 -> 7, second hit 6 + 9/marked -> 9 + 13/marked
[x] Striker Q: no lock-on, slow-start dash (30% -> 100% speed over 0.8s, 0.95s long) with steering (turn:3) and walls do not cancel it (xd options ramp/r0/turn/nw; xdUpd) - untested
[x] Glitch hitbox: phase shock reach K.r+11 -> K.r+9 (GLR); the line + landing-circle preview is removed, own Glitch just shows one circle outlining the hitbox
[x] Glitch blink preview always on for own Glitch while ready (shock reach ring + landing spot); I assumed 'e ability' = its blink, ask user if they meant E dash
[x] Survivors drop items with R (dropItem; host handler too); AI drops heal/speed/cloak at a low teammate who has no item
[x] 0.1% Doubloon killer each round (setting DBL 'dl' in Settings > Unlocks, on by default; used where the random killer is picked: goS and spGo)
[x] Doubloon 0.1% also in online rounds: when the killer is an AI (no human killer) mpGo now rolls dblRoll() too (same DBL toggle, host's setting decides); a human-picked killer is never replaced
[x] Sapper sees every survivor while the guided missile flies (mslMove sets hl)
[x] Sapper R rework: with nothing primed R drops a crater 9 units ahead (extra 0.9s windup, radius 8, crU/trail cr:1): survivors inside when it lands get a bomb, else it stays as a slowing crater (max 3, until stepped in + 5s). Not synced to online friends, AI killers do not aim it on purpose - untested
[x] Medkit item: 3.5s slowed windup like Speed (hit or item key cancels, keeps item), heals 50% (was 30%) - HWU/HEALF/sbk
[x] Disruptor ring: stun lands once the killer has spent 80% of the 2.4s inside (DZN, z.ni), leaving early is allowed if enough time remains; stuns right at 80%
[x] Checked in 19_2: Disruptor 80% ring rule (DZN) and Medkit speed-style windup with cancel on a real hit (hurt -> sbw) were already working, no change needed

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minion Killer</title>
<style>
/* ===== BOOT COVER =====
   A solid dark layer sits on top of the page from the very first paint. The page (header, title screen, blurred
   background match) builds underneath it, and the cover fades out only after everything has loaded and two frames
   have been drawn. This hides the half-built, stuttering first second. */
html{background:#0b0c11}
#boot{position:fixed;inset:0;z-index:9999;background:#0b0c11;transition:opacity .45s ease}
#boot.out{opacity:0;pointer-events:none}
/* ===== THEME VARIABLES ===== */
:root{--bg:#eceef4;--fg:#1c1e29;--mut:#5d6275;--ac:#c2253a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e13;--fg:#eceef6;--mut:#8f94a8;--ac:#ff5a6a}}
:root[data-theme="dark"]{--bg:#0d0e13;--fg:#eceef6;--mut:#8f94a8;--ac:#ff5a6a}
/* Page layout: header strip on top, game area (canvas + overlays) fills the rest */
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
/* Header: title, "This is AI" tag and the version button */
header{padding:8px 14px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
h1{font-size:16px;margin:0;color:var(--ac);letter-spacing:.01em}
header span{color:var(--mut);font-size:12px}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px}
header .aib{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 10px;border-radius:99px;color:var(--ac);border:1px solid var(--ac);white-space:nowrap}
button.vb{margin:0;padding:2px 10px;font-size:11px;font-weight:700;border-radius:6px;background:transparent;color:var(--mut);border:1px solid var(--mut);cursor:pointer}
button.vb:hover{color:var(--fg);border-color:var(--fg)}
/* Changelog box on the title screen */
.chl{margin:16px auto 0;max-width:460px;text-align:left;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);max-height:34vh;overflow:auto}
#ov .chl h3{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:#9aa0b8;text-transform:uppercase}
#ov .chl h4{margin:8px 0 4px;font-size:13px;color:#fff}
.chl ul{margin:0;padding-left:18px}.chl li{margin:3px 0;font-size:12px;color:#c4c8d8}
/* Game area: the canvas, the online video element and every overlay live in here */
main{flex:1;position:relative;min-height:0;overflow:hidden;background:#0b0c11}
canvas{width:100%;height:100%;display:block;background:#0b0c11;cursor:crosshair}
/* Full-screen overlay used for the title, menus, pause, settings and shop screens */
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,9,14,.82);color:#eceef6;padding:16px;overflow:auto}

/* Title screen: blurred background match */
canvas.bl{filter:blur(3px);transform:scale(1.05)}

/* menu: labelled option rows, on/off switches and a shared round-timer strip */

.orows{display:flex;flex-direction:column;gap:12px;margin-bottom:10px}
.orow{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.orw2{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px 22px}.orw2 .orow{flex:1 1 190px;min-width:0}
.olb{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8f94a8}
#ov .oh{font-size:12px;color:#9aa0b8;margin:0}
#ov .tap{margin:0 0 8px}
.seg{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.16)}

/* Character cards in the menu (glow colour comes from --c) */
button.cd{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 10px 9px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-left:5px solid var(--c);color:#eceef6;font-weight:600;transition:transform .12s,background .12s,box-shadow .12s}

.msp{border-top:3px solid #8f5cf0}
#ov .hn{font-size:12px;color:#9aa0b8;margin:6px 0 0}
.hp summary{cursor:pointer;font-weight:700;letter-spacing:.06em}
/* Info panel pinned to the bottom of the menu (selected character details + play button) */
.inf{position:sticky;bottom:0;margin-top:14px;padding:12px 14px;border-radius:14px;background:#0e1018;border:1px solid rgba(255,255,255,.14);border-top:3px solid var(--c,#e23b4d);display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 -12px 30px rgba(0,0,0,.45)}

<!-- Game script. Sections: data (killers, survivors, maps) > helpers > combat > AI > UI/menus > input > rendering > main loop > online play -->
<script>
// CORE STATE. Canvas + overlay handles, world size (WW x WH), counters, selected options and the AI difficulty table (DF). Zf() returns the active difficulty.
let cv=document.getElementById('c'),ctx=cv.getContext('2d');const ov=document.getElementById('ov'),ovt=document.getElementById('ovt');
const N=6;let WW=200,WH=120,PK=2,itN=0,S,sel=0,traps=[],kb=0,kbm=0,SV=0,P=null,vs=0,AA=2,SPING=0,sty=0,mapI=0,rmap=1,lastM=-1;let TTL=0,TS=0,mSel=['c',0],mHdr='',scr='m',mArm=0,HB=0,PSN=0;let SVT=90,kt=1,KTL=180,kTU=0,dfI=1,endless=0,SP=0,FM=0,pz=0,PM=0,PZ0=0,spK=-1,spS=-1,spD=1,spT=0,spR=0,spX='',spA=1,spAT=0;const DF=[{n:'Easy',t:60,sp:.78,fT:.7,ac:2.6,hr:35,bf:.35},{n:'Normal',t:90,sp:.92,fT:.3,ac:1.2,hr:999,bf:.6},{n:'Hard',t:150,sp:.96,fT:.18,ac:.8,hr:999,bf:.85},{n:'Nightmare',t:240,sp:1,fT:.1,ac:.45,hr:999,bf:.98}],Zf=()=>DF[Math.min(DF.length-1,(SP?spD:dfI)+(endless&&!SP?Math.floor(T/45):0))];
// KILLER ROSTER. n name, col colour, s movement/stamina, m melee (cooldown, range, cone, damage, poison, points), ab ability bar, d description. More killers are added further down with CL.push.
const CL=[
{n:'Minion Master',col:'#e23b4d',s:{walk:8.75,sprint:27.25,max:110,drain:9.5,regen:20.5},m:{cd:2.25,rng:8,ang:.9,dmg:22,po:2,pts:10},tc:30,ab:[['LMB','Slash','m1',2.25],['Q','Shot','q',12],['E','Dash','e',20],['R','Parry','r',22],['T','Minion','t',45]],d:'Point-fed minions. LMB poison slash, Q bouncing shot (press again to recast), E dash (just press or hold it, let go mid-dash to cut it short; after a wall bounce press again to chain), R parry or reveal, T minions (30/65/100 pts).'},
{n:'Brute',col:'#e8742a',s:{walk:9.25,sprint:26.5,max:120,drain:11,regen:19},m:{cd:2,rng:9,ang:1.1,dmg:28,po:3,pts:12},tc:50,ab:[['LMB','Cleave','m1',2],['Q','Hook','q',14],['E','Leap','e',16],['R','Roar','r',24],['T','Berserk','t',40]],d:'Heavy melee, stuns on you last 0.8s (0.4s during berserk). LMB wide bleeding cleave, Q hook pulls a survivor to you, E leap slam to the cursor (with keyboard only aim it lands on the survivor you are facing), R roar tires and slows nearby survivors and reveals everyone within range for 5s, T berserk (50 pts): 12s, faster, stun-resistant again, cleave recharges 1.6x.'},
{n:'Phantom',col:'#8f5cf0',s:{walk:9.5,sprint:25,max:100,drain:9,regen:22},m:{cd:1.2,rng:8,ang:.6,dmg:18,po:0,pts:8},tc:50,ab:[['LMB','Claw','m1',1.2],['Q','Trap','q',5],['E','Blink','e',10],['R','Pulse','r',18],['T','Mark','t',25]],d:'Trickster. LMB fast claw, Q snare traps (max 5, a much bigger trigger area than before, they hurt, root-slow and chain-slow nearby survivors), E blink toward the cursor (drops a trap where you left), R pulse reveals every survivor, T mark (50 pts): the weakest survivor takes 50% more damage.'},
{n:'Reaper',col:'#ff6fb5',s:{walk:9,sprint:26,max:110,drain:10,regen:20},m:{cd:1.8,rng:10,ang:1.3,dmg:30,po:2,pts:12},tc:50,ab:[['LMB','Scythe','m1',1.8],['Q','Sweep','q',9],['E','Dash','e',10],['R','Dread','r',22],['T','Harvest','t',40]],d:'Bruiser. LMB wide poison scythe, Q sweep hits everyone around you, slows and marks them and resets your scythe so E or LMB can follow up, E shade dash is long and rushes through survivors, poisoning and marking each (+50% damage for 4s), and cannot be stunned (press E again mid dash to cancel it early), R dread tires and slows survivors far away, T harvest (50 pts): finishes survivors under 30% health.'},
{n:'Stalker',col:'#7fff4d',s:{walk:9.5,sprint:27,max:90,drain:10,regen:22},m:{cd:1,rng:7,ang:.5,dmg:20,po:1.5,pts:9},tc:50,ab:[['LMB','Stab','m1',1],['Q','Lunge','q',8],['E','Cloak','e',18],['R','Caltrops','r',16],['T','Ambush','t',35]],d:'Ambusher. LMB quick stab (+50% out of a cloak), Q lunge is a fast dash that hits the first survivor (press Q again within 2s to lunge a second time), E cloak: you are invisible to survivors unless they are within lunge range (bots only notice you up close) while you sense every survivor through walls for 4s, R caltrops slow everyone near you, T ambush (50 pts): teleport behind the weakest survivor and strike.'},
{n:'Warden',col:'#c68a3d',s:{walk:8.5,sprint:25,max:130,drain:9,regen:20},m:{cd:2.4,rng:8,ang:1,dmg:32,po:0,pts:14},tc:50,ab:[['LMB','Mace','m1',2.4],['Q','Slam','q',11],['E','Impale','e',14],['R','Gravity','r',26],['T','Judge','t',40]],d:'Controller. LMB heavy mace, Q slam shocks and slows nearby survivors, E impale charge: spears every survivor it touches and carries them pinned to your front until it ends (the AI keeps steering at the next survivor to spear more) (a wall crushes them harder), stun-proof while charging and you can steer it a little (your stamina does not recover while you charge). The charge lasts about 1.8s until it catches someone, and every survivor you spear adds a lot of time (+3.3s for the first, +3.6s for the second, +4.7s for the third and so on, up to 16s) and a little speed, R gravity drags every survivor nearby to you, T judge (50 pts): marks survivors in range so they take 50% more damage.'},
{n:'Hunter',col:'#00bcd4',s:{walk:9.25,sprint:26,max:100,drain:10,regen:21},m:{cd:1.4,rng:8,ang:.8,dmg:22,po:1,pts:10},tc:50,ab:[['LMB','Blade','m1',1.4],['Q','Harpoon','q',9],['E','Grapple','e',10],['R','Volley','r',14],['T','Sniper','t',30]],d:'Marksman. LMB blade, Q harpoon is a projectile that hooks a survivor, drags them to you and locks their dash for 2s, E grapple pulls you along the aim line to the first wall or survivor, R volley fires a fan of five slowing bolts, T sniper (50 pts): a piercing bolt that marks everything it hits, and firing it reveals every survivor for 4s.'},
{n:'Tempest',col:'#fff176',s:{walk:9.5,sprint:27,max:100,drain:11,regen:22},m:{cd:1,rng:7,ang:.7,dmg:16,po:0,pts:8},tc:50,ab:[['LMB','Gale','m1',1],['Q','Gale Dash','q',8],['E','Gust','e',9],['R','Cyclone','r',22],['T','Storm','t',40]],d:'Skirmisher. LMB quick gale slash, Q gale dash chains up to three dashes (recast within 1.5s), E gust throws a wide piercing wind blade that slows, R cyclone sends a slow tornado that drags survivors into it, T storm (50 pts): slows and reveals everyone near you while you speed up.'},
{n:'Spectre',col:'#cfd8dc',s:{walk:9.25,sprint:25.5,max:105,drain:10,regen:21},m:{cd:1.2,rng:8,ang:.7,dmg:20,po:1.5,pts:9},tc:50,ab:[['LMB','Claw','m1',1.2],['Q','Boomerang','q',7],['E','Phase','e',12],['R','Orb','r',18],['T','Haunt','t',35]],d:'Wall-walker. LMB poison claw, Q soul blade is a boomerang that hits on the way out and back, E phase dash glides through walls, R homing orb seeks the nearest survivor, T haunt (50 pts): marks, reveals and tires every survivor near you.'},

const VER='v3.3',CHL=[[VER,["Guard: health 150 to 125 and damage reduction 20% to 12.5%, in exchange for a little more speed (0.94 to 0.96)","Map gimmicks: fixed a bug where a survivor you control, after being hit by a Brute Hook, Gravity or Blood Hook, stopped being moved by ice, conveyor belts and portal pads for the rest of the round","Lighthouse: the beam you see is now exactly the area that lights you. It widens a little up close and runs a few units past the wall that stops it, just like the real hit check, and the Hitboxes view outlines it in yellow","Hitboxes: far more moves show their reach now. While a killer winds up you see the area radius (Brute roar, Striker hunt, Puppeteer grand show, Sapper powder keg and more), the projectile lane (Hunter, Tempest, Spectre, Lifebinder, Viper, Puppeteer, Ricochet and more) or the Striker pounce cone. The Fencer parry window and the Glitch phase shock reach are drawn too","Ice Rink: rebuilt again at the same size as the Lighthouse. The ice is now only in four frozen ponds, each with an L-shaped island and a post to slide round, and everything else is solid floor. Every quadrant has a hollow hut with doorways on all sides, a boulder and a pond, the edges have killer-door walls and bars, and the centre is a hollow compound you can run through or round. The whole map is mirrored left to right and top to bottom","Status effects: Speed (the 2s wind-up and the 5s boost) and Cloaked no longer show as text in the top left. They are normal status effect bars on the right of the screen now","Disruptor: the stun ring is a bit bigger and no longer vanishes when the killer steps out. It stays on the Disruptor for the full 2.4s and slows any killer inside it. Only a killer who stays inside the whole time is stunned (leaving cancels the stun), and that stun now lasts 30% longer","Disruptor: no longer throws an instant circle stun when covering a teammate (only the ring now)","Punch: the hitbox is taller (9 to 12) and a little wider (6.8 to 7.6), and with Hitboxes on it is drawn as a dashed rectangle on any survivor holding a Punch","Punch: the hitbox is taller now (7.6 to 12.4 across the punch) but it has a short 0.2s windup. A dashed outline shows where it will land, you can still steer it until it does, and it is cancelled if you are pinned or knocked out","Pickups: holding an item and pressing F next to a different one on the ground swaps them. The item you drop can't be swapped back for 3 seconds, so F still uses what you just took","Online: the arrow keys now move your aim crosshair on your own screen too (the host already used them). Aim assist and map pickups follow the host's setting for everyone in the room (shown as Host: in your Settings), Bray stays your own choice","Online betting: eliminated players now bet with the Killer vs Survivor panel when only one survivor is left, the same as in singleplayer. The small bet box is gone","Online speed: the host sends fewer state updates (40 a second for small rooms), the state diff and wall encoding are much cheaper, and the host lowers its own render resolution when its frame rate drops, like friends already did (a little quicker now)","Warden Impale: keyboard aim assist no longer locks onto the survivors you are carrying, so steering with the arrow keys stops wobbling between them","Arrow keys: if you roll from Left to Right (or Up to Down) without letting go, the key pressed last wins instead of the two cancelling out, so the aim always turns back properly. Works online too","Online: Show personalities no longer labels a killer that a player is controlling","Speed item: a real hit (not poison or other chip damage) cancels the wind-up and keeps the item, and a circle closes in around the survivor until the speed kicks in, like a killer wind-up circle","Hitboxes: the Glitch shows its phase shock reach (and your own Glitch shows where the blink lands). The Puppeteer Grand Show no longer draws a ring that did nothing","Skins: a new Your image skin for every character costs 1000 points. Pick any picture; it is cropped square and shrunk to 64x64 (about 2 KB). Online it is sent once with your character pick and the round start, and nothing extra is sent while you play","Joke characters: the Bray setting now also adds Doubloon, an overpowered gold coin killer. Its attack cooldown is the shortest in the game (0.09s, hold the button to keep swinging) and it never knocks anyone back","Sapper: the Proximity Mine is now a Guided Missile. It starts slow with sharp turning and speeds up while it turns less over 4.5s, you steer it with where you look, Q again detonates it, a direct hit on a survivor gives them the hot potato instead of a blast, and the Sapper gets a speed boost that lasts longer the longer you steered","Help: a new How the game works drop-down below Full controls and survivor types explains hits, stuns, dashes, items, bombs, Last Stand and points"]],['v3.2',["Items: the Blink pickup is gone. The new Punch pickup is a melee stun: you lunge a very short way toward where you aim (arrow keys or mouse) and throw a punch with a rectangular hitbox in front of you. A killer it touches is stunned for 2 seconds (the usual killer stun rules still apply). It misses if the killer is not in the rectangle, and the item is used up either way. AI survivors pick it up and use it when the killer is close","Scout: the stun is now a pizza slice with its curved crust at the Scout and the point at the far end (it was a flat-based triangle). Same reach and width as before"]],['v3.1',["Online: friends now see killer-only doors (teal) and golden timed walls. The wall flags were never sent to them, so every wall looked like a plain wall","Online: the survivor round timer now follows the real clock (it ignored the +30s per elimination and the Last Stand countdown)","Online: the Last Stand banner (Killer vs Survivor) and countdown now show on friends' screens too","Online: you earn points for winning rounds (a survivor who gets away +25, a killer who eliminates everyone +30, +10 if under 1:30). A mini shop on the right of the lobby and round-over screens buys locked killers and survivors","Online: a Settings button on every online menu screen. Back returns you to the room without leaving it","Online: the round-over buttons ignore clicks for 1.5s, so spamming attack no longer lands on Leave and drops you at the title screen. Tabbing away as a friend no longer opens the pause menu, and the round result is only counted once","Warehouse: the killer-only doors and the walls they touched are gone","Ice Rink: walls on the ice are drawn dark with a bright outline","Last Stand: map pickups no longer spawn","Glitch: ability cooldown 12s to 18s"]],['v3.0',["Lighthouse (was Watchtower): a much bigger island (240 x 144) with the striped lighthouse in the middle, a keeper's compound round it (a running loop inside and a bigger one outside), four huts, boathouses, boulders and four long piers with killer-only doors. The beam clears the compound walls, so the loops around the tower are lit, but buildings further out cast shadows","The beam now hurts both sides: survivors it catches are revealed, marked and slowed, and the killer is slowed (BLINDED BY THE BEAM)","New pickups: Speed (40% faster for 5s), Medkit (3.5s slowed windup, then heals 50% now and more over 3s), Cloak (invisible to the killer for 6s unless right next to it, and the beam cannot see you) and Breaker (tears a hole in the nearest wall, like the Bulwark's pickup). Items appear now and then in random spots on every map, a survivor can hold only one, and F uses it (rebindable, ITEM button on touch). AI survivors grab and use them too","Settings: Unlock all killers, survivors and skins is a plain on/off toggle again (the unlock code is gone)","Settings: Map pickups can be Off, Lighthouse only or All maps (default)"]],['v2.9',["Warden: Impale's charge is shorter until it catches its first survivor (about 1.8s instead of 2.6s; the time added by each spear after that is the same as before), and stamina does not recover while you charge","Striker: stamina does not recover while you pounce or rush in with the flurry","Survivor dash now lets stamina recover at half speed while you dash","Glitch: the phase shock stun lasts 0.3s longer","Disruptor: the stun is now a ring (a bit bigger than the old range) left where you stand. A killer inside it is slowed, and if they stay inside for the whole 2.4s they are stunned. Using it no longer slows you down","Ice Rink: the middle and the side lanes are now normal floor, only the corners and the top and bottom are ice","Viper: Venom Rush slips much less on ice","Sapper: Q is now a proximity mine and E is a powder trail (no more projectile and dash); R also sets off armed mines and powder","Doppelganger: while disguised, its attack hitbox and ambush flash are hidden from survivors","Online: friends get up to 60 updates a second in small rooms (when the host's frame rate allows), shorter and jitter-aware smoothing, their own character reacts faster to movement keys, lag compensation uses the real update rate, and their canvas resolution drops automatically if their frame rate does"]],['v2.8',["Unlock all in Settings now needs an unlock code","Pillars map reworked: four big pillars, a ring of medium ones and a long colonnade with a killer-only door down its middle. Every other map except the Maze also got large thin rectangles to run round, each with a killer-only door across the middle: survivors have to go all the way round, the killer can walk straight through (the Maze always has its loop rooms)","Ice Rink: Glitch's phase shock and any other blink, dash or portal jump no longer launch you across the ice","Minion Master: the first E dash fires when the windup ends even if you let go, so you can just press or hold it. Wall-bounce dashes are unchanged","AIs now use the map gimmicks: survivors escape through portal pads, weave on the ice and duck out of the Watchtower beam, killers take portals and conveyor belts as shortcuts, lead their aim on ice and chase survivors the searchlight catches. Sapper bombs are handed on by AI survivors and avoided by their teammates","New maps: Ice Rink (ice makes you slide and turn slowly), Portal Station (step on a pad to jump to its twin), and Watchtower (two searchlights sweep the map and reveal and mark survivors caught in the open)","The Maze always has loops now: two rooms get all their inner doors opened with a pillar in the middle to run circles around. The default map is now Random","Bulwark: the wall from Wall Throw now rises ahead of the survivor in the direction they were running, at any angle, built from blocks like the Architect's walls","Bulwark: Wall Throw is now two presses. R once tears a wall out of the map (or gathers a rubble slab when none is near) and you carry it, a little slower, for up to 9s. R again hurls it. A stun or running out of time drops it","Bulwark: the outer map barrier can no longer be ripped open, the thrown slab can no longer leave the map, and the wall it raises behind a survivor is kept fully inside the barrier","New killer: Sapper (Bomber). Q sticky bombs and E breach prime survivors with a fuse, and a primed survivor who gets close to a teammate hands the bomb over with a shorter fuse and a bigger blast. R detonates every primed survivor, T powder keg primes everyone near you","New survivor: Survivalist (Lone wolf). Carries up to 3 rations and only looks after itself. Space eats one: cleanses slows, poison and marks, heals 20 HP over 4s and gives a burst of speed. A new ration turns up every 28s and slows wear off twice as fast"]],['v2.7',["Doppelganger reworked: the clone ult is gone. T Disguise lets you take the face of a survivor for up to 20s (35 pts, you start with one): AI survivors ignore you, a player survivor sees another survivor, and your first shiv out of it is an ambush that hits 50% harder","Doppelganger's new quiet moveset: LMB shiv, Q lookalike (decoy survivor trap), E body double (swap places with a lookalike), R hush (silences survivors near you). Hits now give full points","Ricochet: your own discs can now hit you after bouncing and slow you a little, and discs hit harder at base (Q 9 to 12, R fan 7 to 9)","Bulwark: max armor is now 2 charges (only Juggernaut still gives 3). Wall Throw now rips a real hole out of a nearby wall and throws that slab","Hunter: Harpoon now locks the hooked survivor's dash for 2s","Brute Hook and Hunter Harpoon now show their hitbox as a red telegraph during the windup","Survivors who stun the killer now cut their tether if they were tethered to it","Survivors on keyboard aim: the Scout and Guard stuns lock onto the killer (uses the Aiming setting, mouse aim is untouched)","Ricochet: Shatter leaves a poison, slowing puddle where each disc was","Brute: with keyboard only aim, Leap lands on the survivor you are facing"]],['v2.6',["Every round now guarantees a Medic or a Cleric (random), not just a Medic","Heal delay only shows (status and the 'heal in Ns' label) while a Medic is close enough to be healing you. Cleric Mend ignores the heal delay","Cleric: smaller Mend range (30 to 22) and a slightly weaker heal (26 to 22, self 18 to 15)","Parry now stuns the killer for 2 seconds","Fixed Glitch bots falling back to a circle stun instead of their blink dash","Circle stun effects now grow to the stun's real hitbox size","Phantom Q snares have a much bigger trigger area; E blink traps are unchanged","Scout: holding the arrow keys to aim the stun slows your movement","Ricochet Rebound dash is about 50% longer","Survivor dash is more reliable: a press that lands slightly early is buffered for 0.3s"]],['v2.5',["Smoother start: the page now stays covered by a dark loading layer until everything has loaded and drawn, then fades in, so the title screen no longer stutters in","Fixed a crash in the key handlers when the browser sent a key event with no key (autofill and some input methods)","Fixed the version button rebuilding a local match underneath a live online room: it now leaves the room first","The file is now commented section by section"]],['v2.4',["New killer: Ricochet (Angle-shooter). Q disc bounces off walls up to 4 times and hits harder with every bounce, E rebound is a dash that bounces off up to 2 walls, R fan throws three discs, T shatter detonates every disc in flight","Reaper: LMB scythe damage 26 to 30","Scout: the stun triangle now aims with the arrow keys or the mouse (whichever you used last) instead of your movement, and a faint outline shows where it will go","Slinger: the arrow keys now aim the shot (they did nothing before), so keyboard only play works. Aim assist follows the arrow direction and you can re-aim during the windup"]],['v2.3',["Fixed the blur on friends' screens: the blurred menu backdrop stayed on (and enlarged the picture, which also threw their mouse aim off) when a match started after joining from the title screen"]],['v2.2',["AI killers: every killer now rotates between play styles during a round (Rushdown, Zoner, Isolator, Bait, Ambush) instead of sticking to one. Each killer favours some styles, so those come up more often, and the Zoner style is the rarest","Parry: the stun a parry gives the killer is longer (about 40% more)","Reaper: the shade dash is longer (0.28s to 0.46s, about 50 units), press E again mid dash to cancel it early (and recover faster), and its cooldown is 10s (was 11s)","Online: friends' screens are drawn at their own resolution (no more blur) and sharp on high resolution screens, movement is smoothed on their end, and updates are much lighter because only what the renderer needs is sent","Online: a chat column on the left while you are in the lobby or between rounds. The host relays messages, long messages are trimmed, and offensive words are masked","Online: players who are out can bet on the round (survivors win or killer wins, a right guess pays x2) with their saved points, like spectator bets","Online: friends can press V (or tap MAP) to see the whole map, and the map no longer stays open into the next round for the host"]],['v2.1',["Online play no longer streams video. The host sends the game state (positions, health, timers, walls, effects, cooldowns) and every friend draws the match themselves, at their own screen size and frame rate, with their own settings and hitbox view. The host no longer draws or encodes a video per friend, so big rooms are much lighter on it","Only what changed is sent, about 30 times a second (20 in rooms of 5 or more), and movement is smoothed on each screen. Friends' aim is now sent as a position in the world, and the map toggle and spectating are local","Lag compensation now allows for the state-sync delay instead of video delay"]],['v2.0',["Usernames: pick a name in Settings, Profile (or on the Play online screen). 2 to 16 letters, numbers, spaces, _ . or - and a blocklist rejects offensive names. Your name shows in lobbies, round results, over survivors and in the spectator banner, and the host re-checks every name it receives","Server browser: Play online, Host open room (listed) puts your room in the list; Browse open rooms shows every open room with its host, player count and whether a match is running. Hosts can switch a room between Open and Private in the lobby and kick players","Join between matches: an open room with space can be joined at any time. If a match is running you wait in the room and play from the next round","Settings, Online: a live Ping counter (your round trip to the host in a room, every friend's ping if you host) and a Test button that measures the matchmaking server"]],['v1.9',["Mobile online play: friends on phones and tablets get the touch controls in a match (smooth analog move stick, aim and attack stick or stun and dash buttons, ability buttons, MAP). Eliminated players get previous and next buttons to spectate, and the screen is kept awake","Online lag compensation: the host measures every friend's ping and checks a friend's attacks, stuns and dashes against where their targets were on their screen (up to 250 ms back). Friends' projectiles do the same and fade back to real time as they fly","Settings, Online: Show ping. Friends see their round trip to the host; the host sees every friend","Killers now get 3 seconds of stun immunity after every stun, in every mode (it was 1.5 seconds and only when you played the survivor)","When you spectate someone you now see their ability cooldowns, including after you are eliminated in an online match"]],['v1.8',["Online play now takes a full room: up to 6 friends can join one code (7 players with the host). One player is the killer (the host, any friend, or an AI killer, picked in the lobby) and everyone else is a survivor; spare survivor slots are AI. The lobby lists who is playing what","Online rounds no longer end when a player is eliminated: eliminated players spectate (A / D to switch) and the round runs until every survivor is down, time runs out or the killer burns out","After a round the host gets NEW ROUND (same players, same roles and characters) or Back to lobby to change roles; friends see who survived. If a friend leaves mid match the AI takes over their survivor (or the killer)","Keyboard aim assist (Settings, Aiming: Off / Low / Medium / High, default Medium): when you aim with the arrow keys, a survivor you can see near the aimed direction pulls the aim onto them and a gold ring shows the target. Mouse aim is untouched. The Slinger gets it too","Scout: the stun triangle now points the way you move (this undoes the v1.2 flip)","Medic: waits 7 seconds after a survivor is hit (was 10) and the wait is now a Heal delay status effect with a countdown"]],['v1.7',['Online play: Play online on the title screen or main menu. One of you hosts and shares the 5 letter room code, the other joins with it. One is the killer and one is a survivor (the other 5 survivors are AI); the round ends when the human survivor is eliminated or time runs out. The host runs the match and streams it, so it plays best on the same network','Ward is much weaker on the Guard: only 20% less damage for 3s and no last-stand save (everyone else is unchanged)','Medic only heals survivors who have not been hit for 10 seconds, and a small heal in Ns timer shows over recently hit survivors']],['v1.6',['Hitboxes: area attacks now show their radius when hitboxes are on (dashed while winding up, a solid ring that fades when it fires), including the Warden slam, shocks, roars, Cleric mend and Warden ward','Warden: Impale lasts longer (2.6s) and every survivor you spear adds much more time (+2.5s, +3.6s, +4.7s and so on, up to 16s)']],['v1.5',['New survivor: Cleric, a support healer. Space: Mend, a burst that heals you and nearby survivors, cleanses poison, halves slows and leaves a short regeneration (no stun, 16s cooldown)','The Strongest AI now lands Black Flashes much more often, and how often depends on the AI difficulty (Easy about a third, Normal 60%, Hard 85%, Nightmare almost always); it also holds its other moves while a flash is lining up','Fortress: removed the four extra killer-only doors, keeping the two in the middle']],['v1.4',['Striker: E is now Flurry, a rush and pin into a stun-proof 5-hit combo with a 16 damage finisher that blasts nearby survivors; Q is a weak first hit, and its second hit now scales with how many survivors are marked (6 + 9 per marked survivor)','The Strongest: World Cutting Slash now deals 60 damage and puts Q, E, R, T and your slash on full cooldown']],['v1.3',['Viper: however Venom Rush ends (timer, E again, Q/R/T, a stun) you snap back to where you started, and a green RUSHING bar replaces the stamina bar','Slinger: small aim crosshair, shots go where the mouse points, and you can re-aim during the windup','Double Trouble moved from Settings to the new Game modes panel; new Beginner mode only puts you up against characters you own','Shop: killers cost more the harder they are (Phantom, then Puppeteer, then The Strongest last); the first 3 killers and survivors are free Beginner picks','Spectate: A / D swap who you watch, S toggles auto rotate; a new background match always starts when one ends','Domain-caster reworked: Slash, Dismantle, Cleave (bites deeper on hurt survivors), Fuga (long windup fire arrow) and passive Black Flash recasts after Q, E and R','Gambler and Lifebinder have new unique movesets; Bulwark gets Wall Throw and a smash-into-wall Bash; Slinger stands still while charging; Bray (joke survivor) can be switched on in Settings']],['v1.2',['Hexlord is now The Strongest (Sukuna inspired): Cleave with timed Black Flash and Zone, Dismantle, Shrine Step, Spiderweb, Malevolent Shrine','Tap T then Cleave for Fuga (long windup, half shrine cooldown on T); tap T then Q, E, R, T to chant World Cutting Slash (Q, E and R go on cooldown)','Spectre: press Q again to recall the boomerang (it still slows on the way back)','Architect: Rampart now deals 20 damage per hit','Scout: hitbox direction flipped for the Scout you control']],['v1.1',['Spectre: the boomerang only slows survivors on its way back (stronger slow, and it changes colour when it turns)','Scout: attack aim now locks to where you aim when you press attack (it no longer follows your movement), and the hit area is a pizza slice with a rounded crust instead of a plain triangle','Architect: Rampart cooldown 10s to 16s, Cage cooldown 14s to 22s so nobody can be trapped forever; Rampart hit damage is now 10','Spectate: new Killer difficulty selector','Header: This is AI tag and a version button that returns to this title screen','Title screen: added this changelog']]];
